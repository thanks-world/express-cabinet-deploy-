services:
  redis:
    image: redis:7-alpine
    container_name: cabinet-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - cabinet-net

  gateway:
    build: ./gateway
    container_name: cabinet-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODBUS_HOST=192.168.10.1
      - MODBUS_PORT=5020
    networks:
      - cabinet-net

  nginx:
    image: nginx:1.25-alpine
    container_name: cabinet-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks:
      - cabinet-net

#networks:
#  cabinet-net:
#    driver: bridge
networks:
  cabinet-net:
    name: cabinet-net
